[workspace]
members = [
    "crates/irauth-core",
    "crates/irauth-hardware",
    "crates/irauth-backend-howdy",
    "crates/irauth-daemon",
    "crates/irauthctl",
    "crates/pam-irauth",
    "crates/irauth-passkey",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["itsfuad <fuad.cs22@gmail.com>"]
repository = "https://github.com/itsfuad/irauth"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
